# Configuración de Netlify
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Función programada: revisa las tareas de todas las personas y les manda un
# resumen (push) si tienen algo vencido, para hoy, o próximo. Corre 2 veces al
# día: 12:00 UTC y 00:00 UTC (aprox. 8:00 am y 8:00 pm en Chile — ajustable).
[functions."send-reminders"]
  schedule = "0 12,0 * * *"

# Función programada: revisa cada 15 minutos si hay una actividad/tarea con
# hora específica que esté por comenzar (según cuántas horas de anticipación
# eligió cada persona), y manda un aviso puntual para esa tarea.
[functions."send-activity-alerts"]
  schedule = "*/15 * * * *"

# Función programada: una vez a la semana (domingo ~18:00 UTC, ~2pm Chile),
# le manda a cada persona que activó "Resumen semanal" en Configuración un
# correo con cómo le fue: completadas, atrasadas, y qué se le quedó
# "parcial" repetidamente. Ajustable si prefieres otro día/hora.
[functions."send-weekly-report"]
  schedule = "0 18 * * 0"
